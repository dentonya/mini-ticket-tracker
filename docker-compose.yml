services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-ticket-tracker-db
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tickets -d tickets']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
