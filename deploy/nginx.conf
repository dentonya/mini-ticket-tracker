# nginx site for Mini Ticket Tracker. Serves the built web app and proxies /api to the API.
# Copy to /etc/nginx/conf.d/mini-ticket-tracker.conf, set server_name (and `listen` to match
# your other sites), then: nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name tickets.example.com;

    root /var/www/mini-ticket-tracker/apps/web/dist;
    index index.html;

    # Swagger UI loads its assets relative to the page, so it needs the trailing slash.
    location = /api/docs {
        return 301 /api/docs/;
    }

    # The trailing slash on proxy_pass strips the /api prefix: /api/tickets -> /tickets.
    location /api/ {
        proxy_pass http://127.0.0.1:4100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints asset filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/tickets, /analytics, /activity) all serve the SPA.
    location / {
        try_files $uri /index.html;
    }
}
